<!-- Versión 1: Diseño Clásico -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Digital - Versión Clásica</title>
    <link rel="stylesheet" href="classic-styles.css">
</head>
<body>
    <header class="classic-header">
        <h1>Portal Digital de Atención Integral</h1>
    </header>
    <main>
        <section class="classic-login">
            <h2>Acceso al Sistema</h2>
            <form>
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario">

                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena">

                <button type="submit">Iniciar Sesión</button>
            </form>
        </section>
    </main>
    <footer class="classic-footer">
        <p>Universidad Tecnológica de la Huasteca Hidalguense</p>
    </footer>
</body>
</html>

<!-- Versión 1: Diseño Clásico -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Digital de Atención Integral</title>
    <link rel="stylesheet" href="modern-styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="logo.png" alt="Logo" class="logo">
            <h1>Portal Digital de Atención Integral</h1>
        </header>
        <main class="login-section">
            <h2>Acceso al Sistema</h2>
            <form>
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario">
                
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contraseña">
                
                <button type="submit">Iniciar Sesión</button>
            </form>
        </main>
        <footer class="footer">
            <p>Universidad Tecnológica de la Huasteca Hidalguense</p>
            <p>Derechos reservados - 2025</p>
        </footer>
    </div>
</body>
</html>
